services:
  - type: web
    name: aurora-interruptible-voice-agent
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: RIME_MODEL_ID
        value: mistv3
      - key: RIME_SPEAKER
        value: celeste
      - key: RIME_AUDIO_FORMAT
        value: mp3
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: FRONTEND_URL
        value: https://aurora-realtime-ai-orchestration-engine.vercel.app
      - key: RIME_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
